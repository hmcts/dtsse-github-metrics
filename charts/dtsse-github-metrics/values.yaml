nodejs:
  applicationPort: 3000
  aadIdentityName: dtsse
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  ingressHost: dtsse-github-metrics.{{ .Values.global.environment }}.platform.hmcts.net
  # A report over the whole estate is held in memory as JS objects, which the chart's 512Mi default will not
  # hold. Measure before lowering.
  memoryRequests: 2Gi
  memoryLimits: 4Gi
  cpuRequests: 500m
  cpuLimits: "1"
  # One replica while the report cache is per-process: each would otherwise warm its own copy of the same
  # estate, for no gain and twice the memory.
  replicas: 1
  keyVaults:
    dtsse:
      secrets:
        - name: app-insights-connection-string
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
        - name: postgres-host
          alias: POSTGRES_HOST
        - name: postgres-port
          alias: POSTGRES_PORT
        - name: postgres-user
          alias: POSTGRES_USER
        - name: postgres-password
          alias: POSTGRES_PASSWORD
        - name: postgres-database
          alias: POSTGRES_DATABASE
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    OTEL_SERVICE_NAME: dtsse-github-metrics
    OTEL_ENABLED: true
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=3072
  # The web pod holds NO GitHub credential. It never contacts GitHub — that is what makes the serving path
  # read-only — and a credential it cannot use is only a credential that can leak.

job:
  enabled: true
  # The SAME image as the web pod, with the collector's entry point instead of the server's.
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  aadIdentityName: dtsse
  command: ["node"]
  args: ["dist/cli/run.js", "collect", "--config", "/app/metrics.yaml", "--days", "90"]
  # Weekly, early Monday. Collection runs to the estate's whole 90-day window, so a missed run is a hole in the
  # series rather than a gap that heals.
  schedule: "0 3 * * 1"
  # A run that is still going when the next is due must not have a second one join it: they would write the same
  # coverage rows.
  concurrencyPolicy: Forbid
  # One attempt. A 1850-repository collection must not silently retry six times, and its own exit status already
  # distinguishes a partial run from a failed one.
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  keyVaults:
    dtsse:
      secrets:
        # Set by hand rather than by Terraform: a GitHub App private key is not a value Terraform generates, and
        # putting it in a public repository's state is not an option. See the README.
        - name: github-app-id
          alias: GH_APP_ID
        - name: github-app-installation-id
          alias: GH_APP_INSTALLATION_ID
        - name: github-app-private-key
          alias: GH_APP_PRIVATE_KEY
        - name: postgres-host
          alias: POSTGRES_HOST
        - name: postgres-port
          alias: POSTGRES_PORT
        - name: postgres-user
          alias: POSTGRES_USER
        - name: postgres-password
          alias: POSTGRES_PASSWORD
        - name: postgres-database
          alias: POSTGRES_DATABASE
        # `github-token` is deliberately NOT mounted. `resolveCredentials` prefers the App, so a PAT beside it is
        # dead weight that would quietly take over if the App key were ever rotated badly — reporting the whole
        # estate's merge gates and alerts as unavailable rather than failing loudly.
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=3072

postgresql:
  enabled: false

global:
  jobKind: CronJob
  enableKeyVaults: true
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
