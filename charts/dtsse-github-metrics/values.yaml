# THIS FILE IS WHAT AAT RUNS, AND A CHANGE HERE ONLY ARRIVES IF `Chart.yaml`'s `version` IS BUMPED WITH IT.
#
# `hmcts-charts/stable/dtsse-github-metrics` is a machine-published mirror of this directory: the CNP pipeline's
# `Publish Helm chart` stage rsyncs `charts/dtsse-github-metrics/` over it with `--delete-after` on every master
# build. So editing this file IS how the deployed values change — there is no second copy to keep in step, and
# nothing here is limited to previews.
#
# The trap is the version, not the file. Flux's `HelmChart` for this release uses `reconcileStrategy:
# ChartVersion`, so source-controller repackages only when the version STRING changes. A new revision carrying
# the version already released is ignored: the edit lands in `hmcts-charts`, the pipeline goes green, and AAT
# keeps serving the old values with nothing anywhere reporting a problem. Nothing bumps the version for you —
# the publishing step reads it out of `Chart.yaml` and passes it through, and the inherited Renovate preset's
# helm handling fires on chart DEPENDENCY updates, not on a values edit.
#
# So: every values change is a two-line change. Bump `version:` in `Chart.yaml` in the same commit.
nodejs:
  applicationPort: 3000
  aadIdentityName: dtsse
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  ingressHost: github-metrics.{{ .Values.global.environment }}.platform.hmcts.net
  # Coupled to NODE_OPTIONS --max-old-space-size below: the V8 heap ceiling must stay strictly under
  # memoryLimits, or V8 declines to collect until it is already past the point the kernel OOM-kills the
  # container. Change one, change the other. 3072 MiB of heap inside a 4Gi limit leaves room for the
  # non-heap side of the process.
  memoryRequests: 2Gi
  memoryLimits: 4Gi
  cpuRequests: 500m
  cpuLimits: "1"
  # THE SAME FIGURES AGAIN UNDER `dev*` KEYS, because the chart reads one pair or the other and never both.
  # `library/templates/v2/_container.tpl` branches on `global.devMode`: when it is set the container takes
  # `devmemoryLimits`/`devcpuLimits` and the four values above are ignored outright. The CNP pipeline sets
  # `devMode: true` on the `-staging` release it installs for `functionalTest:aat`, so staging silently ran at
  # the chart defaults — a 512Mi limit holding a process told to grow its heap to 3072Mi.
  #
  # That is not a smaller pod, it is a dead one. The warmer reads the whole estate on the main thread, went
  # past 512Mi, and the kernel killed it (exit 137, OOMKilled); Kubernetes restarted it, it warmed, and it died
  # again. Every `@regression` failure blamed on a flaky ingress was Traefik correctly reporting that it had no
  # backend, because the pod was in that loop. AAT never showed it: Flux installs that release without devMode,
  # so it always had the 4Gi.
  #
  # Staging is the only place these apply and it reads the same 1,890-repository database as AAT, so it needs
  # the same room. Keep all eight in step.
  devmemoryRequests: 2Gi
  devmemoryLimits: 4Gi
  devcpuRequests: 500m
  devcpuLimits: "1"
  replicas: 1
  keyVaults:
    dtsse:
      secrets:
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
        - name: github-metrics-postgres-host
          alias: POSTGRES_HOST
        - name: github-metrics-postgres-port
          alias: POSTGRES_PORT
        - name: github-metrics-postgres-user
          alias: POSTGRES_USER
        - name: github-metrics-postgres-password
          alias: POSTGRES_PASSWORD
        - name: github-metrics-postgres-database
          alias: POSTGRES_DATABASE
        - name: entra-client-id
          alias: ENTRA_CLIENT_ID
        - name: entra-client-secret
          alias: ENTRA_CLIENT_SECRET
        - name: session-secret
          alias: SESSION_SECRET
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=3072
    ENTRA_TENANT_ID: "{{ .Values.global.tenantId }}"
    ENTRA_REDIRECT_URI: https://github-metrics.{{ .Values.global.environment }}.platform.hmcts.net/auth/callback

job:
  enabled: true
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  aadIdentityName: dtsse
  # Set here rather than left to the `job` chart, whose defaults are 512Mi/1024Mi — below the
  # --max-old-space-size ceiling in `environment` below, so V8 would still be declining to collect at the
  # point the kernel OOM-killed the container. The two numbers are coupled: change the heap ceiling and
  # this limit together. Matched to the web pod rather than trimmed to fit under 1Gi, because the
  # collector's working set is the larger of the two — it walks the whole estate and deserialises tens of
  # MB of jsonb.
  memoryRequests: 2Gi
  memoryLimits: 4Gi
  command: ["node"]
  args: ["dist/cli/run.js", "collect", "--config", "/app/metrics.yaml", "--days", "90", "--tolerate-partial"]
  schedule: "0 14 * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  keyVaults:
    dtsse:
      secrets:
        - name: github-app-id
          alias: GH_APP_ID
        - name: github-app-installation-id
          alias: GH_APP_INSTALLATION_ID
        - name: github-app-private-key
          alias: GH_APP_PRIVATE_KEY
        - name: github-metrics-postgres-host
          alias: POSTGRES_HOST
        - name: github-metrics-postgres-port
          alias: POSTGRES_PORT
        - name: github-metrics-postgres-user
          alias: POSTGRES_USER
        - name: github-metrics-postgres-password
          alias: POSTGRES_PASSWORD
        - name: github-metrics-postgres-database
          alias: POSTGRES_DATABASE
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=3072

orgJob:
  enabled: true
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  aadIdentityName: dtsse
  # Same coupling as `job` above: the heap ceiling in `environment` below has to sit inside this limit.
  memoryRequests: 2Gi
  memoryLimits: 4Gi
  command: ["node"]
  args: ["dist/cli/run.js", "collect-org", "--config", "/app/metrics.yaml", "--tolerate-partial"]
  # 13:30 UTC daily, half an hour ahead of `collect` at 14:00. Ordering rather than coincidence: ownership is
  # what the behaviour figures are attributed to, so each day's figures should be read against the same day's
  # graph. Half an hour is ample on measurement rather than assumption: this walk took 9 minutes on 2026-09-15.
  # Daily rather than weekly because it precedes `collect`, and because the walk fits inside one hour of the
  # installation's quota (see the deadline below), so the finer drift resolution costs nothing worth saving.
  schedule: "30 13 * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 1
  # Two hours, not the six `job` allows. The team, repository and people walks are about 250 GraphQL calls, but
  # the ownership ladder adds up to three CODEOWNERS requests per unresolved repository and one collaborator
  # listing per repository still open after that — bounded by `unresolved_repository_limit`, so up to roughly
  # 2,000 more REST calls on top. Against an installation budget of 15,000 core and 12,500 GraphQL an hour it
  # still fits inside one hour's quota; the deadline is doubled because fitting the QUOTA is not the same as
  # fitting the WALL CLOCK, and a run still going after two hours has found something the estimate did not.
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  keyVaults:
    dtsse:
      secrets:
        - name: github-app-id
          alias: GH_APP_ID
        - name: github-app-installation-id
          alias: GH_APP_INSTALLATION_ID
        - name: github-app-private-key
          alias: GH_APP_PRIVATE_KEY
        - name: github-metrics-postgres-host
          alias: POSTGRES_HOST
        - name: github-metrics-postgres-port
          alias: POSTGRES_PORT
        - name: github-metrics-postgres-user
          alias: POSTGRES_USER
        - name: github-metrics-postgres-password
          alias: POSTGRES_PASSWORD
        - name: github-metrics-postgres-database
          alias: POSTGRES_DATABASE
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=3072

sonarJob:
  enabled: true
  image: hmctsprod.azurecr.io/dtsse/github-metrics:latest
  aadIdentityName: dtsse
  # Smaller than the two collectors, and deliberately: this run holds 315 SonarCloud projects and one small table,
  # where `collect` deserialises tens of MB of jsonb. The heap ceiling in `environment` below still has to sit
  # inside this limit — change one, change the other.
  memoryRequests: 1Gi
  memoryLimits: 2Gi
  command: ["node"]
  args: ["dist/cli/run.js", "map-sonar", "--config", "/app/metrics.yaml", "--tolerate-partial"]
  # WEEKLY, AND ON A MONDAY MORNING. Three decisions, and each is about what this run costs rather than about
  # tidiness.
  #
  # WEEKLY because the answer only changes when SonarCloud's project list does. A resolved project is skipped
  # until something is analysed after the row was written, so a daily run would re-read the listing, skip almost
  # everything and buy nothing — while a project created this week is one week late at worst, and `collect` reads
  # the map every day either way.
  #
  # NOT INSIDE `collect` OR `collect-org` for the reason `map-sonar` is a command of its own: one commit search
  # per unanswered project against a quota of 30 a minute documented and 10 observed is 10 to 30 minutes for this
  # organisation. Adding that to the daily walk would lengthen it by a third for a map that had not changed, and
  # it would couple two failures — a spent search quota would land inside the run that collects the estate.
  #
  # 09:00 UTC, four and a half hours ahead of `collect-org` at 13:30, because all three take the same collector
  # lock: a run still going when the next one starts makes the next one stand down. Four and a half hours is an
  # order of magnitude more than the longest resolve, and it keeps this inside the same in-hours window the other
  # two jobs run in rather than trusting an out-of-hours cluster to be up.
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  backoffLimit: 1
  # One hour: twice the longest measured resolve. A run still going after that has found something the estimate
  # did not, and the rows it already wrote are kept — every answer is stored as it is arrived at.
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  keyVaults:
    dtsse:
      secrets:
        # The GitHub App credentials, because the commit search that resolves a project is a GitHub call. There is
        # NO SonarCloud secret here: the reads this makes — the project listing, a project's analyses and its
        # measures — all answer anonymously, and the `dtsse` vault holds no SonarCloud token. `sonarToken` in
        # `sonar/client.ts` picks one up from `SONAR_TOKEN` if a deployment ever adds one, which would widen the
        # answers to the organisation's private projects and change nothing else.
        - name: github-app-id
          alias: GH_APP_ID
        - name: github-app-installation-id
          alias: GH_APP_INSTALLATION_ID
        - name: github-app-private-key
          alias: GH_APP_PRIVATE_KEY
        - name: github-metrics-postgres-host
          alias: POSTGRES_HOST
        - name: github-metrics-postgres-port
          alias: POSTGRES_PORT
        - name: github-metrics-postgres-user
          alias: POSTGRES_USER
        - name: github-metrics-postgres-password
          alias: POSTGRES_PASSWORD
        - name: github-metrics-postgres-database
          alias: POSTGRES_DATABASE
  environment:
    NODE_CONFIG_ENV: "{{ .Values.global.environment }}"
    METRICS_CONFIG: /app/metrics.yaml
    NODE_OPTIONS: --max-old-space-size=1536

postgresql:
  enabled: false

global:
  jobKind: CronJob
  enableKeyVaults: true
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
