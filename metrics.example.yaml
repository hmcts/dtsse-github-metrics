version: 1
organization: hmcts
# No `database:` key. Upstream named two SQLite files here; this port stores everything in Postgres
# and takes the connection string from DATABASE_URL (or the POSTGRES_* parts the Helm chart mounts),
# because where the data lives is a deployment concern rather than a policy decision.
lookback:
  operational_days: 90
  maximum_days: 365
  stale_open_days: 14
  stale_collection_days: 2
triviality:
  maximum_lines: 10
  maximum_files: 1
assessment:
  enabled: true
  minimum_merges: 10
  independent-review-coverage:
    green_percentage: 90
    amber_percentage: 70
  approval-coverage:
    green_percentage: 90
    amber_percentage: 70
  checks-passing-at-merge:
    green_percentage: 90
    amber_percentage: 70
  # Flow signals are graded by cost rather than compliance, so the boundary is a maximum, not a
  # minimum — and each is reported as a caution, never allowed to hold the readiness label down,
  # because a cost is never evidence that anything ungoverned merged.
  pull-request-size:
    maximum: 400
  merge-cycle-time:
    maximum: 24
  time-to-first-review:
    maximum: 8
  # Two allowances, and a repository is within the policy when either forgives it: the percentage
  # carries the judgement because two unreviewed merges out of 246 is a pair of lapses and two out
  # of 20 is a habit, and the count is the absolute floor beneath it for a thin cohort.
  unreviewed-substantial-merges:
    maximum_count: 0
    maximum_percentage: 1
  # A caution boundary rather than a green/amber pair: a shallow review rate is weighed, never
  # allowed to hold the readiness label down.
  review-depth-minimum-percentage: 50
# Neither number enters the readiness label. `reference_patterns` is a list because HMCTS traces work
# through both a GitHub issue and a Jira key; the defaults below match those two.
#
# THE TWO ARE APPLIED AT DIFFERENT TIMES, unlike every other pair of options in this file, and it is worth
# knowing which. Pull-request descriptions are no longer STORED — they were two thirds of the fact cache,
# read off disk on every render to reach a length and a regex match — so what a collection stores is the
# length of each description and whether it referenced anything.
#
#   `minimum_description` is compared against that stored length when a report is BUILT, so raising or
#   lowering it regrades every cached merge on the next render with nothing refetched.
#
#   `reference_patterns` are applied when facts are COLLECTED, because a pattern cannot be re-run against a
#   description nobody kept. An edited list takes effect as the cache is rewritten, which is one collection;
#   merges already cached keep the answer the previous patterns gave.
traceability:
  minimum_description: 30
  reference_patterns:
    - '#\d+'
    - '[A-Z][A-Z0-9]+-\d+'
# Removed from the cohort outright, whatever the graph says about them. The graph can say what a
# repository IS but not that somebody decided it should not be reported, so this stays in the file.
excluded_repositories: []
# WHICH REPOSITORIES THE ESTATE IS.
#
# This replaced `teams:` as the answer. The cohort is read from the graph `collect-org` collects —
# `org_repositories` joined to `repository_ownership` on the rows that are still current — and this block
# selects from it. A hand-maintained list of 1,872 names went stale the day it landed: a repository created
# on Tuesday stayed invisible until somebody noticed, and one archived on Wednesday kept being collected.
#
# What that gives up, deliberately: adding a team is no longer a reviewed change. A stale list is the worse
# failure, and the change-versioned tables make "what joined the cohort this week" a query rather than a
# diff of a file nobody updated.
#
# `collect` therefore DEPENDS ON `collect-org` HAVING RUN. On an empty database it refuses and says so
# rather than reporting an estate of zero repositories; the chart sequences the two at 14:00 and 15:00.
cohort:
  # WHO COUNTS, and the two lists answer different questions. This one is "whose work is not the cohort's":
  # dependency bots raise mechanical version bumps, and counting them inflated every throughput figure,
  # deflated both timing medians and pushed quiet repositories past `assessment.minimum_merges`. Applied when
  # a report is BUILT rather than when facts are collected, so changing it takes effect on the next render
  # with no recollection. Agent-authored PULL REQUESTS stay in the cohort deliberately — one was opened,
  # reviewed and merged through the gate, which is the practice being measured.
  excluded_authors:
    - renovate
    - dependabot
  # And this one is "which accounts are not people". `isHumanAccount` reads the `Bot` account type and the
  # `[bot]` login suffix first; this is the third signal, and on the direct-commit path it is the only one
  # that fires — of 9,663 stored direct commits on the HMCTS estate not one carries `authorType: "Bot"`,
  # because GitHub answers `User` for every linked account, and these three author 44% of them: `fluxcdbot`
  # 3,179 (32.9%), `hmcts-platform-operations` 1,109 (11.5%), `claude` 36.
  #
  # A named list and never a substring rule: `gemmatalbot` is a person with 53 pull requests, and calling
  # somebody's work automation is worse than the miscount it would fix. Matched case-insensitively and
  # through the same normalisation as above, so a `[bot]` suffix on either side is tolerated.
  #
  # It keeps these accounts out of the direct-commit cohort — a deploy bot reconciling an image tag is not a
  # person bypassing review — and out of the contributor lists. It does NOT touch merged pull requests, which
  # `excluded_authors` decides.
  bot_accounts:
    - fluxcdbot
    - hmcts-platform-operations
    - claude
  # REPOSITORIES WHERE NO PERSON PUSHES TO THE DEFAULT BRANCH. A repository named here reports `0` direct commits
  # instead of the sentence saying nobody read them; the count itself still comes from the facts, so naming one that
  # does hold direct commits reports them rather than hiding them.
  #
  # A DECLARATION, and the reason it cannot be inferred instead: a ruleset requiring a pull request on the default
  # branch looks like proof that a direct push is impossible, and 91 of the 413 repositories carrying such a gate on
  # the HMCTS estate still hold direct-commit facts. Empty is the right default — a repository nobody has declared
  # and whose walk did not reach it must still report an absence.
  #
  # What it is for is a repository whose commit walk cannot finish and so never writes coverage: HMCTS's
  # `cnp-flux-config` is 362,987 commits on `master`, and the pushes are `fluxcdbot`'s, which `bot_accounts`
  # already excludes. Matched case-insensitively, because a name here is typed by hand.
  no_direct_pushes: []
  # Which visibilities count. All three is the default. Narrowing to `[public]` is what a deployment does
  # when the credential cannot read the others: 830 of HMCTS's 1,796 active repositories are private or
  # internal, and each is refused until the App's pending `pull_requests: read` is approved, so admitting
  # them early fills the dashboard with `unavailable` rows instead of figures.
  visibilities:
    - public
    - internal
    - private
  # Archived repositories are out by default: nobody is working in one, so every figure it carries is a
  # fact about the past that no team can act on.
  include_archived: false
  # How recently a repository must have been pushed to for its BEHAVIOUR to be collected. From 2026-09-14
  # this decides what `collect` walks and NOT who is in the estate. 90 days walks roughly 1,230 of HMCTS's
  # 1,880, and the rest are now reported, carrying the assurance answers that need no merge history and none
  # of the behaviour figures that do. Dropping them from the estate hid the repositories the assurance
  # criteria are most about: 334 unarchived HMCTS repositories are a year or more stale and not one had been
  # collected. `null` collects every repository's behaviour.
  #
  # NOT THE CHEAPEST LEVER ON COST, whatever this comment used to say. The merge walks were most of a run's
  # calls before the alert families were added; a run measured on 2026-09-15 spent almost all of its roughly
  # 11,000 calls on per-repository alert and gate reads instead, and those are read estate-wide now. Narrowing
  # this window is a judgement about what is worth reporting, not a cost control.
  #
  # A repository GitHub reports NO last push for is not collected. That matters for one run after the column
  # was added, when it is null everywhere: treating absence as active would walk the whole organisation.
  active_within_days: 90
  # How long since the last push before a repository reads "should be archived" on /repositories.
  #
  # A SECOND, WIDER WINDOW, and the two are not the same question. The one above decides whether behaviour is
  # collected; this decides whether the repository is flagged as code that is dead and unmarked. A repository
  # between them — six months quiet — has no behaviour collected and is NOT flagged, which is a third state
  # rather than a gap.
  #
  # ONE YEAR from 2026-09-15, where it was two. Measured at the move: non-archived HMCTS repositories sit
  # 1,250 inside 90 days, 306 between 90 days and a year, 186 between one and two years, 100 between two and
  # three and 48 beyond three. Two years flagged 148; a year flags 334, the 186 in the middle band being what
  # moved. The old boundary was set to spare annually-released services, and that is what this rejects: a
  # service released once a year is pushed to far more often than it is released, so a whole year of silence
  # is worth an answer. `null` flags none, for a deployment that would rather read the age and judge it by eye.
  #
  # A repository with no last push at all is NOT flagged. GitHub omits it for one never pushed to, and an
  # absence is not evidence of neglect — the opposite reading from `active_within_days` above, deliberately:
  # each defaults to the answer that does not invent a fact.
  unmaintained_after_days: 365
# OWNERSHIP OVERRIDES, and no longer the cohort. Listing a repository here does not put it in the estate —
# it says who owns it, feeding the ladder's `configured` rung so a hand-set owner beats every inferred one.
# `display_name` names a team the graph only knows by slug. Empty is the normal case: most teams come from
# the graph and are reported under their slug.
teams:
  - identifier: example
    display_name: Example Team
    repositories:
      - example-service
# When agentic tooling was turned on for each repository, which the tool cannot observe. It anchors
# the `trend` baseline and periods, and parses exactly as a window edge does: a bare date is UTC
# midnight, a naive datetime is UTC, an offset is honoured. A repository listed here gets a series, one
# omitted reports that it has no date. No longer cross-checked against the cohort at load time: the file
# cannot know the cohort without opening a database, so a name that matches nothing is reported by the
# report rather than refused by the schema.
enablement:
  example-service: 2026-06-01
# The SonarCloud organisation key. Omit it when it matches `organization`, as it does at HMCTS; it is
# here only because the two names are allowed to differ.
sonar_organization: hmcts
# The answer of last resort for a repository whose project the stored `map-sonar` map cannot settle,
# and the only place a human decides a mapping. Ambiguity is real: `rpx-xui-icp-api` declares
# `em-icp-api` in its `sonar-project.properties`, and so does `em-icp-api` itself, so at most one of
# them owns the project and no evidence in either repository says which. Every name must be a
# configured repository and no key may be empty, because an override silently meaning "unresolved"
# would read as a decision somebody made.
sonar_projects:
  example-service: example-service
# Where the list of repositories approved to deploy to production is published: HMCTS's
# `environment-approvals.yml`, the document its deployment pipeline reads to decide whether a
# repository may be promoted to an environment at all, whose `prod:` sequence is what puts a
# `Production` badge on a row. The fetch is unauthenticated — the file is public and a token sent to a
# raw content host would be a leak buying nothing — and it is made by the service, refreshing on
# `--warm-interval` rather than on a collection. Set it to `null` to disable the fetch entirely; no
# repository then carries a badge. The default below is HMCTS's and is only a default.
production_list_url: https://raw.githubusercontent.com/hmcts/cnp-jenkins-config/refs/heads/master/environment-approvals.yml
# How `collect-org` decides who owns a repository. Off unless `enabled: true`, so an existing
# configuration file does not change meaning by being upgraded.
#
# ATTRIBUTION IS BEST EFFORT AND SOME OF IT WILL BE WRONG. GitHub has no field for "owner": the
# `teams-api-*` rungs read team ACCESS, which says who CAN merge, and the `codeowners-*` rungs read
# who is EXPECTED to review. Every stored answer names the rung that produced it so a reader can
# weigh it rather than trust it, and a repository nothing claimed is reported as unowned rather than
# quietly attributed.
#
# The four numbers below are policy judgements about how far to guess, not measurements. They are the
# figures the generator this ladder was ported from ran with against the HMCTS estate, so changing
# one is arguing with a tuned value rather than filling in a blank.
org_graph:
  enabled: true
  # Attributed repositories a name prefix needs before it may attribute others, and the proportion of
  # them that must agree on one team. The prefix index is LEARNED from each run's evidenced decisions
  # and never hardcoded, and inference never feeds itself — an inferred repository cannot widen a
  # prefix — so one wrong guess cannot reach the threshold on its own and take a whole name family
  # with it.
  prefix_support: 3
  prefix_dominance: 0.8
  # Above this share of the estate, a team holds access administratively rather than editorially and is
  # not read as a claim. Left in, such a team is the only claim on much of what no service team
  # happened to claim, and would absorb it — replacing an honest `unowned` with a confident wrong
  # answer. It deliberately does not apply to CODEOWNERS, where naming a team in one repository is a
  # per-repository act rather than a blanket grant.
  maximum_team_share: 0.25
  # Above this many members, a team is a population rather than an owner — an "all developers" group. This is
  # the filter neither of the others can replace: such a team is not named, and it may hold a perfectly
  # unremarkable number of repositories, so only its size gives it away. Counted over immediate membership,
  # and a team whose members could not be listed counts as zero, because being refused the membership is not
  # evidence of being large.
  #
  # 100 is measured, not chosen. Only eight of HMCTS's 336 teams hold more than 50 members and half of those
  # are ordinary product teams that are simply large — `opal` at 69 members and 24 repositories,
  # `possession-claim-service` at 65 and 8 — so a ceiling of 50 would disown about 44 well-owned
  # repositories. The distribution then jumps from 92 members to 217, and above that gap everything is a
  # population or a blanket grant.
  maximum_team_members: 100
  # Handles that are not owners by IDENTITY rather than by size. `all-org-members` is the organisation
  # wearing a team's clothes: attributing a repository to it says only that the repository is in the
  # organisation, which the graph already says by listing it, and no threshold makes that an owner.
  excluded_teams:
    - all-org-members
  # A ceiling on how many repositories one run may pay the per-repository CODEOWNERS and collaborator
  # rungs for — a ceiling, not a target. The residue left after the free rungs is not knowable in
  # advance across 3,277 repositories, and a run that walks all of it is better discovered as an
  # incomplete exit than as a six-hour job.
  unresolved_repository_limit: 500