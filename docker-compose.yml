services:
  postgres:
    image: postgres:16-alpine
    container_name: dtsse-github-metrics-postgres
    environment:
      POSTGRES_DB: github_metrics
      POSTGRES_USER: hmcts
      # Local only. The deployed database takes its credentials from the dtsse Key Vault.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmcts -d github_metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
