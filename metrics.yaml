version: 1
organization: hmcts
lookback:
  operational_days: 90
  maximum_days: 365
  stale_open_days: 14
  stale_collection_days: 2
triviality:
  maximum_lines: 10
  maximum_files: 1
assessment:
  enabled: true
  minimum_merges: 10
  independent-review-coverage:
    green_percentage: 90
    amber_percentage: 70
  approval-coverage:
    green_percentage: 90
    amber_percentage: 70
  checks-passing-at-merge:
    green_percentage: 90
    amber_percentage: 70
  pull-request-size:
    maximum: 400
  merge-cycle-time:
    maximum: 24
  time-to-first-review:
    maximum: 8
  unreviewed-substantial-merges:
    maximum_count: 0
    maximum_percentage: 1
  review-depth-minimum-percentage: 50
traceability:
  minimum_description: 30
  reference_patterns:
    - '#\d+'
    - '[A-Z][A-Z0-9]+-\d+'
excluded_repositories: []
# WHICH REPOSITORIES THE ESTATE IS. This block replaced the `teams:` list that used to name them one by one:
# the cohort now comes from the graph `collect-org` walks, and this selects from it. Review the policy here,
# not the membership — at 1,872 repositories a committed list of names was stale the day it landed.
cohort:
  # ACCOUNTS THAT ARE NOT PEOPLE, where nothing GitHub returns says so. Stated here rather than left to the
  # default because the membership is a judgement about named accounts and belongs in a reviewed file.
  #
  # `isHumanAccount` reads the `Bot` account type and the `[bot]` login suffix before this list. On the direct
  # commit path neither fires: of 9,663 stored direct commits NOT ONE carries `authorType: "Bot"` — GitHub
  # answers `User` for every linked account — and these three author 44% of them. `fluxcdbot` is 3,179
  # (32.9%, `name="Flux project bot"`), `hmcts-platform-operations` 1,109 (11.5%) and `claude` 36. Counting
  # them made the direct-push figures largely a measure of deployment automation rather than of people
  # bypassing review.
  #
  # `hmcts-platform-operations` IS THE ARGUABLE ONE: it is a shared account that people also drive by hand,
  # so listing it treats 1,109 commits as automation. Removing this line reverses that, and nothing else has
  # to change.
  #
  # Not a substring rule, ever: `gemmatalbot` is Gemma Talbot, who has 53 pull requests here.
  bot_accounts:
    - fluxcdbot
    - hmcts-platform-operations
    - claude
  # REPOSITORIES WHERE NO PERSON PUSHES TO THE DEFAULT BRANCH, stated, so the row reports `0` rather than "the
  # direct commits were not read". A declaration and never read off the branch ruleset: 91 of the 413 repositories
  # here carrying a pull-request-required gate still hold direct-commit facts, `cnp-flux-config` among them.
  #
  # `cnp-flux-config` is the one repository on the estate whose commit walk cannot finish — 362,987 commits on
  # `master`, 18,714 inside the window — so it writes no coverage and would report an absence for good. Its last 20
  # `master` commits are 19 without a pull request and all of them `fluxcdbot`'s, which `bot_accounts` above
  # already excludes; the human figure is none, and this is what lets the column say so.
  no_direct_pushes:
    - cnp-flux-config
  # All three, because the App's `pull_requests: read` has now been approved. This was narrowed to `[public]`
  # while it was pending: 962 private and 547 internal repositories were refused outright, so admitting them
  # would have filled the dashboard with `unavailable` rows rather than figures. Verified after approval —
  # `doctor` reads every configured repository with zero refusals, including the internal one that used to
  # answer FORBIDDEN. Expect the estate to roughly double against the 788 measured under `[public]`.
  visibilities:
    - public
    - internal
    - private
  # 90 days, and from 2026-09-14 this decides what `collect` WALKS rather than who is in the estate. It walks
  # roughly 1,230 of the estate's 1,880, and the 650 it skips are now REPORTED, carrying the assurance
  # answers that need no merge history and no behaviour figures at all. Dropping them outright hid exactly
  # the repositories the assurance criteria are about: 334 unarchived repositories here are a year or more
  # stale, and not one of them had ever been collected.
  #
  # THIS IS NO LONGER THE CHEAPEST LEVER ON COST, and the claim that it was aimed a reader at the wrong half
  # of the run. The merge walks were most of a run's calls before the alert families were added; the
  # architecture review of 2026-09-15 measured a steady-state run at roughly 11,000 calls and found the spend
  # almost entirely in per-repository REST alert and gate reads. Those are read for the whole estate at once
  # now, so narrowing this window buys a fraction of what it used to. Narrow it because a stale repository has
  # no ways of working worth reporting, not to save calls.
  active_within_days: 90
  # How long since the last push before a repository reads "should be archived" on /repositories. A wider,
  # separate window from the one above: at six months a repository has no behaviour collected AND is not
  # flagged, which is a real third state rather than a gap.
  #
  # ONE YEAR from 2026-09-15, where it was two. Measured at the move — non-archived repositories here sit
  # 1,250 inside 90 days, 306 between 90 days and a year, 186 between one and two years, 100 between two and
  # three and 48 beyond three. Two years flagged 148; a year flags 334. The 186 in the middle band are the
  # ones that moved, and a year with no commit at all is long enough to want an answer about: the previous
  # boundary was set to spare annually-released services, and a service that really is released annually is
  # pushed to far more often than it is released.
  unmaintained_after_days: 365
# The organisation graph `collect-org` walks, which is now what the cohort is read from. Thresholds are left
# at their defaults, documented with the measurements behind them in metrics.example.yaml; only `enabled` is
# stated, because it is the switch that decides whether the daily walk runs at all and that belongs in a
# reviewed file rather than in a chart value.
org_graph:
  enabled: true
sonar_organization: hmcts
production_list_url: https://raw.githubusercontent.com/hmcts/cnp-jenkins-config/refs/heads/master/environment-approvals.yml
