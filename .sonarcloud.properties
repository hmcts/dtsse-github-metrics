# Scope for SonarCloud's AUTOMATIC ANALYSIS, which does not read sonar-project.properties.
#
# This repository is analysed twice, by two SonarCloud projects: the CI scan that `Jenkinsfile_CNP` runs against
# the key in `sonar-project.properties`, and Automatic Analysis against the key SonarCloud generated when the
# repository was imported from GitHub. Automatic Analysis reads THIS file and nothing else, so without it the
# two disagree about what the project even is: measured, the CI scan analysed 52 files and Automatic Analysis
# analysed 205, including `charts/`, `config/`, `test/`, `biome.json` and the Prisma migrations.
#
# That disagreement is not cosmetic. Automatic Analysis reached
# `prisma/migrations/*/migration.sql` with its ORACLE PL/SQL analyser and reported
# `CHECK (("owner_kind" = 'none') = ("owner" = ''))` as a direct NULL comparison. It is not one: `'none'` is a
# string literal, and comparing two boolean expressions with `=` is how PostgreSQL spells XNOR. One false
# positive was enough to hold the reliability rating on new code at C and fail that project's quality gate.
#
# Kept deliberately in step with `sonar-project.properties` — if you narrow the scope there, narrow it here.
#
# THE REAL FIX IS ONE PROJECT, NOT TWO, and it is not in this file: an organisation administrator turning
# Automatic Analysis off for this repository leaves the CI scan as the single source of truth, and makes this
# file inert rather than wrong. Until then, this stops the duplicate reporting a finding the CI scan cannot see.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=src/app/**,src/components/**,src/lib/**,src/instrumentation.ts,src/proxy.ts,test/**,src/evidence/store/generated/**
