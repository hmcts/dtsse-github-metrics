sonar.projectName=dtsse-github-metrics
sonar.projectKey=dtsse-github-metrics
sonar.language=typescript
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The UI arrived from hmcts/github-metrics with its own enforced 100% coverage gate in
# vitest.config.mts, so it is measured there rather than here. src/lib/api.ts is the exception:
# it is the seam this repo rewrote, so it stays in scope.
sonar.exclusions=src/app/**,src/components/**,src/lib/**,!src/lib/api.ts,src/instrumentation.ts,src/proxy.ts,test/**
