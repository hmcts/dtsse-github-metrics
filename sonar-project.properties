sonar.projectName=dtsse-github-metrics
sonar.projectKey=dtsse-github-metrics
sonar.language=typescript
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The UI arrived from hmcts/github-metrics with its own enforced 100% coverage gate in
# vitest.config.mts, so it is measured there rather than here.
#
# This used to carry a `!src/lib/api.ts` meaning to keep the rewritten seam in scope. Sonar does not
# support negation in an exclusion list, so it never did that — `src/lib/**` excluded api.ts regardless.
# Dropped rather than left reading as an intention the scanner ignores.
sonar.exclusions=src/app/**,src/components/**,src/lib/**,src/instrumentation.ts,src/proxy.ts,test/**,src/evidence/store/generated/**

# Covered by test/integration/** rather than the unit suite, whose lcov report is the only one uploaded
# here — so Sonar would read these as uncovered new code and fail the quality gate on a coverage figure
# that is untrue. store/coverage.ts is at 89% in the integration run.
sonar.coverage.exclusions=src/evidence/store/**,src/evidence/report/repositories.ts,src/evidence/behaviour/fill.ts,src/cli/run.ts,src/app/**,src/lib/api.ts
