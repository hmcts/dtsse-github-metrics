sonar.projectName=dtsse-github-metrics
sonar.projectKey=dtsse-github-metrics
sonar.language=typescript
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# The integration report is second because it now exists in CI: `before('test')` runs `test:integration`,
# which writes `coverage-integration/lcov.info` before the sonar scan reads either path.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info
sonar.exclusions=src/app/**,src/components/**,src/lib/**,src/instrumentation.ts,src/proxy.ts,test/**,src/evidence/store/generated/**

# `src/evidence/store/**` and `report/repositories.ts` are no longer exempt: they were exempt because the only
# suite covering them ran on a laptop, and it now runs on every build at a measured floor of 85% and 78%.
# `behaviour/fill.ts` stays exempt — the integration run reaches 19% of it and no other suite touches it, so
# there is nothing here for Sonar to report yet.
sonar.coverage.exclusions=src/evidence/behaviour/fill.ts,src/cli/run.ts,src/app/**,src/lib/api.ts
