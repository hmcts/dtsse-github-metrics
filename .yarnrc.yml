nodeLinker: node-modules
enableGlobalCache: true

npmScopes:
  hmcts-cft:
    npmRegistryServer: "https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/"
    npmAlwaysAuth: true
    npmAuthToken: "exec:az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv"

# The library's express peer only backs its middleware types; this app uses its health and secrets helpers.
packageExtensions:
  "@hmcts-cft/cloud-native-platform@*":
    peerDependenciesMeta:
      express:
        optional: true

# Prisma's own studio-core peers (react, react-dom, @types/react) are prisma's to provide, not ours.
logFilters:
  - code: YN0086
    level: discard
